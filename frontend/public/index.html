<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hotel Management</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ── Auth message styling ── */
        .auth-message {
            min-height: 40px;
            padding: 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .auth-message.error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px 14px;
        }

        .auth-message.success {
            background: #dcfce7;
            color: #166534;
            padding: 10px 14px;
        }

        /* ── Center auth panel ── */
        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .main-content .panel {
            width: 100%;
            max-width: 440px;
        }

        .panel .eyebrow {
            text-align: center;
            margin-bottom: 4px;
        }

        .panel h1 {
            text-align: center;
            margin: 0 0 20px;
            font-size: 26px;
        }

        .switch-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .switch-row span {
            color: var(--muted);
            font-size: 14px;
        }

        #authSwitch {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
            text-decoration: underline;
        }

        #authSwitch:hover {
            color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <main class="main-content">
        <section class="panel">
            <p class="eyebrow">Hotel Management</p>
            <h1 id="authTitle">Đăng nhập</h1>

            <div id="authMessage" class="auth-message" role="status" aria-live="polite"></div>

            <!-- ── Form đăng nhập ── -->
            <form id="loginForm" class="room-form">
                <label for="loginUsername">
                    <span>Tên đăng nhập</span>
                    <input id="loginUsername" name="username" type="text"
                           autocomplete="username" placeholder="Nhập tên đăng nhập" required>
                </label>
                <label for="loginPassword">
                    <span>Mật khẩu</span>
                    <input id="loginPassword" name="password" type="password"
                           autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                </label>
                <div class="form-actions">
                    <button id="loginSubmitBtn" class="btn btn-primary" type="submit"
                            style="width:100%">Đăng nhập</button>
                </div>
            </form>

            <!-- ── Form đăng ký ── -->
            <form id="registerForm" class="room-form" hidden>
                <label for="registerUsername">
                    <span>Tên đăng nhập</span>
                    <input id="registerUsername" name="username" type="text"
                           minlength="8" maxlength="30" autocomplete="username"
                           placeholder="8–30 ký tự, có ít nhất 1 chữ cái" required>
                </label>
                <label for="registerPassword">
                    <span>Mật khẩu</span>
                    <input id="registerPassword" name="password" type="password"
                           minlength="8" maxlength="30" autocomplete="new-password"
                           placeholder="8–30 ký tự" required>
                </label>
                <label for="registerConfirmPassword">
                    <span>Xác nhận mật khẩu</span>
                    <input id="registerConfirmPassword" name="confirmPassword" type="password"
                           minlength="8" maxlength="30" autocomplete="new-password"
                           placeholder="Nhập lại mật khẩu" required>
                </label>
                <div class="form-actions">
                    <button id="registerSubmitBtn" class="btn btn-primary" type="submit"
                            style="width:100%">Đăng ký</button>
                </div>
            </form>

            <p class="switch-row">
                <span id="authSwitchText">Chưa có tài khoản?</span>
                <button id="authSwitch" type="button">Đăng ký</button>
            </p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
