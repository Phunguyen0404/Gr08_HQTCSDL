<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Khách Sạn & Nghỉ Dưỡng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <main class="auth-card" role="main">
            <header class="auth-header">
                <a href="home.html" class="auth-brand" title="Quay về Trang chủ">
                    <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
                        <path d="M16 3 L28 16 L16 29 L4 16 Z" />
                    </svg>
                    <span class="brand-title-text">KHÁCH SẠN</span>
                </a>
                <div><span class="auth-eyebrow">Hotel Management</span></div>
                <h1 class="auth-title">Đăng nhập tài khoản</h1>
            </header>

            <div id="authAlert" class="auth-alert" role="alert" aria-live="polite">
                <span class="auth-alert-icon">⚠️</span>
                <span id="authAlertText" class="auth-alert-text"></span>
            </div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="auth-field" id="field-loginUsername">
                    <label class="auth-label" for="loginUsername">Tên đăng nhập</label>
                    <div class="auth-input-wrapper">
                        <input
                            type="text"
                            id="loginUsername"
                            name="username"
                            class="auth-input"
                            placeholder="Nhập tên đăng nhập"
                            autocomplete="username"
                            spellcheck="false"
                            required
                        >
                    </div>
                    <span class="auth-field-error" id="error-loginUsername"></span>
                </div>

                <div class="auth-field" id="field-loginPassword">
                    <label class="auth-label" for="loginPassword">Mật khẩu</label>
                    <div class="auth-input-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            class="auth-input"
                            placeholder="Nhập mật khẩu"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <span class="auth-field-error" id="error-loginPassword"></span>
                </div>

                <button type="submit" id="loginSubmitBtn" class="auth-submit-btn">
                    <span class="auth-spinner"></span>
                    <span class="auth-btn-text">Đăng nhập</span>
                </button>
            </form>

            <footer class="auth-footer">
                <span>Chưa có tài khoản?</span>
                <a href="/register" id="toRegisterLink" class="auth-switch-link">Đăng ký ngay</a>
            </footer>

            <div class="auth-role-hint">
                <strong style="color: #12161b; display: block; margin-bottom: 6px;">💡 Gợi ý tài khoản demo:</strong>
                <div>• <strong>Quản trị viên (ADMIN):</strong> <code>admin001</code> / <code>admin123</code></div>
                <div>• <strong>Khách hàng (CUSTOMER):</strong> <code>customer01</code> / <code>admin123</code> (hoặc đăng ký mới)</div>
            </div>
        </main>
        <a href="home.html" class="back-home-link">← Quay về Trang chủ khách sạn</a>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
